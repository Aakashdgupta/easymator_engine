name: easymator_core
description: High-performance 2D skeletal animation and retargeting engine in pure Dart with zero-allocation math and analytical TwoBoneIK.
version: 0.1.0
homepage: https://github.com/Aakashdgupta/easymator_engine
repository: https://github.com/Aakashdgupta/easymator_engine/tree/main/easymator_core
issue_tracker: https://github.com/Aakashdgupta/easymator_engine/issues
topics:
  - animation
  - skeletal-animation
  - ik
  - 2d
  - gamedev

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  vector_math: ^2.1.4
  meta: ^1.11.0

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0
