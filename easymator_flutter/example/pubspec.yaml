name: easymator_example
description: Interactive visual verification sandbox for Easymator skeletal animation engine.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  easymator_flutter:
    path: ../
  easymator_core:
    path: ../../easymator_core
  vector_math: ^2.1.4
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
