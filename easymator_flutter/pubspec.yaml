name: easymator_flutter
description: Flutter rendering bridge, CustomPainters, and widgets for the Easymator 2D skeletal animation engine.
version: 0.1.0
homepage: https://github.com/easymator/easymator_engine
repository: https://github.com/easymator/easymator_engine/tree/main/easymator_flutter
issue_tracker: https://github.com/easymator/easymator_engine/issues
topics:
  - animation
  - skeletal-animation
  - flutter-widget
  - ik
  - 2d

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  easymator_core:
    path: ../easymator_core
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
